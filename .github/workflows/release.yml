name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        run: >
          dotnet publish ClinicCore/ClinicCore.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Pack release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item publish/ClinicCore.exe release/
          Copy-Item scripts/run-supabase.example.bat release/
          Copy-Item database/schema.sql release/
          Copy-Item database/seed.sql release/
          Compress-Archive -Path release/* -DestinationPath ClinicCore-win-x64.zip

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          files: |
            ClinicCore-win-x64.zip
            publish/ClinicCore.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
